<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');
:root{--purple:#90268f;--purple2:#b341ad;--deep:#561653;--gold:#ffc928;--gold2:#ffe58a;--ink:#30243a;--muted:#817888;--line:#eee7ef;--green:#29845d;--red:#c9515a;--shadow:0 16px 44px #40144712}

.topbar{height:72px;padding:0 clamp(16px,5vw,72px);display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #f0eaf2;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px;font-weight:900;color:var(--deep);font-size:18px}.brand img{width:47px;height:47px;object-fit:contain}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:600;margin-top:-4px}.top-actions{display:flex;align-items:center;gap:12px}.top-actions span{font-size:13px;color:var(--muted)}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--purple),#c35eb4);color:#fff;display:grid;place-items:center;font-weight:900}

.auth-panel{padding:38px clamp(22px,4vw,48px);display:flex;flex-direction:column;justify-content:center}.tabs{display:flex;background:#f6f1f7;padding:5px;border-radius:13px;margin:22px 0}.tab{border:0;background:none;flex:1;padding:10px;border-radius:10px;color:var(--muted);font-weight:700}.tab.active{background:#fff;color:var(--purple);box-shadow:0 2px 9px #33203612}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:12px 14px;border:1px solid #e7deea;border-radius:12px;background:#fff;outline:none;color:var(--ink)}.field input:focus{border-color:var(--purple2);box-shadow:0 0 0 3px #a4399e19}.primary{border:0;border-radius:12px;padding:12px 19px;background:linear-gradient(110deg,var(--purple),#b640a4);color:#fff;font-weight:800;box-shadow:0 8px 18px #8b278f2b;transition:.18s}.primary:hover{transform:translateY(-1px);filter:brightness(1.05)}.secondary{border:1px solid #e9ddeb;border-radius:11px;padding:10px 15px;background:white;color:var(--purple);font-weight:700}.full{width:100%;margin-top:9px}.form-note{font-size:11px;color:var(--muted);line-height:1.8;margin:12px 0 0}.error{font-size:13px;color:var(--red);margin:8px 0}
.header-row{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:9px 0 24px}.greeting h1{margin:0;font-size:28px;font-weight:900}.greeting p{margin:3px 0;color:var(--muted);font-size:14px}.hero{background:linear-gradient(110deg,#852283,#ac3c9d 65%,#c658a1);color:white;border-radius:24px;padding:27px 30px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;box-shadow:0 14px 30px #79217421;position:relative;overflow:hidden}.hero:after{content:'✦';font-size:180px;line-height:1;position:absolute;left:4%;top:-45px;color:#ffffff12}.hero h2{font-size:26px;margin:0 0 6px;font-weight:900}.hero p{color:#f8e8f6;margin:0;line-height:1.8}.hero .primary{background:var(--gold);color:#5e3c00;box-shadow:none;margin-top:16px}.hero-mark{width:116px;height:116px;object-fit:contain;background:#fff;border-radius:22px;padding:7px;z-index:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 28px}.stat{padding:15px 17px;background:#fff;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;gap:12px;box-shadow:0 5px 14px #3b144908}.stat-ico{width:42px;height:42px;border-radius:13px;background:#fff4d1;display:grid;place-items:center;font-size:21px}.stat:nth-child(2) .stat-ico{background:#f5e5f5}.stat:nth-child(3) .stat-ico{background:#e5f5ed}.stat strong{font-size:21px;display:block;line-height:1.2}.stat small{color:var(--muted);font-size:12px}
.section-head{display:flex;align-items:end;justify-content:space-between;margin:20px 0 12px}.section-head h2{font-size:19px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.level{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 8px 22px #3b144907;transition:.2s}.level:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.level-icon{width:48px;height:48px;display:grid;place-items:center;background:linear-gradient(135deg,#fff2bf,#ffe49a);border-radius:15px;font-size:24px;margin-bottom:11px}.level h3{margin:0;font-size:17px}.level p{color:var(--muted);font-size:12px;line-height:1.8;min-height:42px;margin:4px 0 12px}.level-foot{display:flex;align-items:center;justify-content:space-between}.level-foot small{color:var(--muted)}.level-foot button{padding:8px 14px;font-size:12px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 22px #3b144907}.game-wrap{max-width:760px;margin:18px auto}.game-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.progress{height:9px;background:#f1eaf3;border-radius:99px;overflow:hidden;margin-bottom:22px}.progress span{height:100%;display:block;background:linear-gradient(90deg,var(--purple),#d56dbc);transition:width .3s}.question-count{color:var(--muted);font-size:13px}.question{font-size:23px;font-weight:800;line-height:1.75;margin:0 0 19px}.answers{display:grid;gap:10px}.answer{padding:13px 15px;border:1.5px solid #eee5f0;background:white;border-radius:13px;text-align:right;color:var(--ink);font-weight:700;transition:.16s}.answer:hover{border-color:#c371bd;background:#fffaff}.answer.correct{border-color:#6dbb91;background:#effaf4;color:#226946}.answer.wrong{border-color:#e89194;background:#fff3f3;color:#a73c48}.feedback{padding:12px 14px;border-radius:12px;margin-top:13px;line-height:1.8;font-size:14px}.feedback.good{background:#eff9f3;color:#27734e}.feedback.bad{background:#fff4e5;color:#80530e}.game-next{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.result{text-align:center;padding:32px 18px}.result .medal{font-size:68px}.result h2{font-size:28px;margin:6px}.result p{color:var(--muted)}.result-score{font-size:20px;color:var(--purple);font-weight:900;margin:14px}

p)}.lab-help{font-size:11px;color:var(--muted);line-height:1.7;margin:9px 0 0}.drag-ghost{position:fixed;z-index:20;pointer-events:none;opacity:.86;transform:translate(-50%,-50%);}
.tug-card{margin:18px 0 24px;background:#fff;border:1px solid #ece3ef;border-radius:20px;padding:21px;box-shadow:0 8px 22px #3b144907}.tug-arena{margin:17px 0;padding:18px 13px;background:linear-gradient(180deg,#f7f3f9,#fff);border:1px solid var(--line);border-radius:16px;overflow:hidden}.tug-track{height:92px;display:flex;align-items:center;position:relative;direction:ltr}.tug-track:before{content:'';position:absolute;left:8%;right:8%;height:7px;border-radius:9px;background:#d8cbd9}.tug-team-figure{position:absolute;z-index:1;font-size:34px;top:0}.tug-team-figure.left{left:4%}.tug-team-figure.right{right:4%;transform:scaleX(-1)}.tug-rope{position:absolute;left:22%;right:22%;height:7px;border-radius:5px;background:repeating-linear-gradient(90deg,#bd8846 0 8px,#f2d394 8px 15px);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:2}.tug-knot{position:absolute;left:50%;top:50%;width:21px;height:21px;border:4px solid #922a8e;background:#ffdc62;border-radius:50%;transform:translate(-50%,-50%);transition:left .45s cubic-bezier(.2,.8,.2,1);z-index:3;box-shadow:0 2px 8px #55215133}.tug-goal{position:absolute;top:13px;bottom:9px;border-left:2px dashed #be9bbe;opacity:.75}.tug-goal.left{left:26%}.tug-goal.right{right:26%}.tug-meter{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}.tug-controls{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}.tug-team{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.tug-team h3{font-size:14px;margin:0 0 6px}.tug-team small{font-size:11px;color:var(--muted)}.tug-team input[type=range]{width:100%;accent-color:var(--purple);margin:13px 0 3px;direction:ltr}.tug-force{font-weight:900;color:var(--purple);font-size:14px}.tug-center{display:flex;align-items:center;justify-content:center}.tug-action{background:linear-gradient(110deg,#8e258c,#b640a4);color:white;border:0;border-radius:13px;padding:12px 16px;font-weight:900;box-shadow:0 6px 15px #8b278f2b;white-space:nowrap}.tug-readout{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}.tug-status{font-weight:800;font-size:13px;color:var(--deep)}.tug-score{font-size:12px;color:var(--muted)}
.teacher-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:18px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:400px}th,td{text-align:right;padding:12px 10px;border-bottom:1px solid #f0eaf1}th{color:var(--muted);font-weight:700;background:#fcfafd}td{font-weight:600}.empty{text-align:center;padding:25px;color:var(--muted);font-size:13px}.concept{padding:11px 0;border-bottom:1px solid #f1ebf2;font-size:13px;line-height:1.7}.concept b{color:var(--purple)}.concept:last-child{border:0}.badge{display:inline-block;padding:3px 9px;border-radius:99px;background:#f7eaf7;color:var(--purple);font-size:11px;font-weight:800}.tools{display:flex;gap:9px;align-items:center}.notice{padding:12px 15px;border-radius:13px;background:#fff6df;color:#755415;font-size:12px;line-height:1.8;margin-top:15px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#33243a;color:white;border-radius:12px;padding:11px 18px;z-index:10;box-shadow:var(--shadow);font-size:13px}.footer-credit{text-align:center;color:#9991a0;font-size:11px;margin-top:30px}.link-btn{border:0;background:none;color:var(--purple);font-weight:800;padding:8px}.stars{color:#e9a900;letter-spacing:1px}
@media(max-width:760px){.tug-card{padding:15px}.tug-controls{grid-template-columns:1fr 1fr}.tug-center{grid-column:1/-1;grid-row:2}.tug-team{padding:10px}.tug-action{width:100%}.tug-track{height:80px}.lab-card{padding:15px}.lab-board{padding:10px}.lab-zone{min-height:118px;padding:9px}.lab-heading{align-items:flex-start}.lab-readout{align-items:flex-start}.auth-grid{grid-template-columns:1fr}.welcome{min-height:unset;padding:24px}.welcome h1{font-size:32px;margin:15px 0 4px}.welcome-logo{width:76px;height:76px}.welcome-credit{margin-top:20px}.auth-panel{padding:24px}.hero{padding:22px;grid-template-columns:1fr}.hero-mark{display:none}.stats{gap:8px}.stat{padding:11px 8px;gap:8px}.stat-ico{width:34px;height:34px;font-size:17px}.stat strong{font-size:17px}.stat small{font-size:10px}.levels{grid-template-columns:1fr}.level p{min-height:0}.teacher-grid{grid-template-columns:1fr}.header-row{align-items:start}.greeting h1{font-size:23px}.topbar{padding:0 15px}.top-actions span{display:none}}
@media(max-width:480px){main{padding:16px 12px 35px}.topbar{height:62px}.brand{font-size:15px}.brand img{width:38px;height:38px}.hero{padding:18px;border-radius:16px}.hero h2{font-size:22px}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{flex-direction:column;text-align:center}.stat strong{font-size:19px}.lab-zones{gap:6px}.lab-zone h3{font-size:11px}.tug-meter{font-size:9px}.game-top{gap:8px}.question{font-size:19px}.game-next{gap:8px;flex-wrap:wrap}}

<header class="topbar"><div class="brand"><img src="https://ipa.edu.jo/wp-content/uploads/2026/04/logo-1.png" alt="شعار أكاديمية الرواد"><div>مغامرة القوى<small>أكاديمية الرواد الدولية</small></div></div></header>

<main id="app"></main><div id="toast" class="toast hidden"></div>
<script>

const lesson=[
{title:'أساسيات القوة',icon:'💪',desc:'ما القوة؟ وكيف نقيسها؟ تعرّف إلى وحدة النيوتن.',questions:[
{q:'ما المقصود بالقوة؟',a:['مؤثر خارجي يغيّر حركة الجسم أو شكله','مقدار المادة في الجسم','المسافة التي يقطعها الجسم'],c:0,why:'القوة مؤثر خارجي يمكنه تغيير الحالة الحركية للجسم أو شكله.'},
{q:'ما وحدة قياس القوة في النظام الدولي؟',a:['الكيلوغرام','النيوتن (N)','المتر'],c:1,why:'تقاس القوة بوحدة النيوتن، ويرمز لها N تكريمًا للعالم إسحاق نيوتن.'},
{q:'إذا أثرت قوتان 15 N و15 N في الاتجاه نفسه، فما محصلتهما؟',a:['0 N','15 N','30 N'],c:2,why:'عندما تكون القوتان في الاتجاه نفسه نجمع مقداريهما: 15 + 15 = 30 N.'},
{q:'قوتان متعاكستان: 20 N إلى اليمين و10 N إلى اليسار. ما المحصلة؟',a:['10 N إلى اليمين','30 N إلى اليسار','10 N إلى اليسار'],c:0,why:'نطرح القوتين المتعاكستين، ويكون الاتجاه نحو القوة الأكبر: 20 − 10 = 10 N يمينًا.'}]},
{title:'محقق الاتزان',icon:'⚖️',desc:'حلّل القوى واكتشف متى يكون الجسم متزنًا.',questions:[
{q:'قوتان متساويتان ومتعاكستان تؤثران في جسم. ما مقدار القوة المحصلة؟',a:['مجموع القوتين','صفر نيوتن','تساوي القوة الأكبر'],c:1,why:'القوى المتساوية والمتعاكسة تلغي أثر بعضها؛ المحصلة تساوي صفرًا.'},
{q:'متى توصف القوى بأنها غير متزنة؟',a:['عندما تكون محصلتها لا تساوي صفرًا','عندما يكون الجسم كبيرًا','عندما تكون جميعها إلى أعلى'],c:0,why:'إذا لم تلغِ القوى أثر بعضها وكانت المحصلة غير صفرية فهي قوى غير متزنة.'},
{q:'كرة ساكنة ومعلّقة بخيط. ما التفسير الأفضل؟',a:['لا تؤثر فيها أي قوة','قوتا الشد والجاذبية متزنتان','تؤثر فيها قوة غير متزنة'],c:1,why:'سكون الكرة لا يعني غياب القوى؛ شد الخيط إلى أعلى يوازن وزنها إلى أسفل.'},
{q:'صندوق تؤثر فيه محصلة قوة غير صفرية. ماذا نتوقع؟',a:['تتغير حالته الحركية','يبقى ساكنًا دائمًا','تختفي كتلته'],c:0,why:'القوة المحصلة غير الصفرية تغيّر الحالة الحركية للجسم.'}]},
{title:'أبطال نيوتن',icon:'🍎',desc:'اختبر فهمك لقوانين نيوتن الثلاثة في مواقف الحياة.',questions:[
{q:'سيارة تتحرك بخط مستقيم وبسرعة ثابتة. وفق القانون الأول، القوى المحصلة عليها…',a:['تساوي صفرًا','تزداد باستمرار','تساوي وزن السيارة'],c:0,why:'يبقى الجسم ساكنًا أو متحركًا بسرعة ثابتة ما لم تؤثر فيه قوى غير متزنة.'},
{q:'أثرت القوة المحصلة نفسها في جسمين، كتلة الأول أقل. أيهما يتغير مقدار سرعته أكثر؟',a:['الجسم ذو الكتلة الأقل','الجسم ذو الكتلة الأكبر','يتغيران بالمقدار نفسه دائمًا'],c:0,why:'القوة نفسها تسبب تغيرًا أكبر في سرعة الجسم ذي الكتلة الأقل.'},
{q:'دفعتَ جدارًا بيدك. وفق قانون نيوتن الثالث، ماذا يحدث؟',a:['يؤثر الجدار في يدك بقوة مساوية ومعاكسة','لا يؤثر الجدار في يدك بقوة','يؤثر الجدار بقوة في الاتجاه نفسه'],c:0,why:'لكل فعل رد فعل مساوٍ له في المقدار ومعاكس له في الاتجاه.'},
{q:'ما اسم زوج القوى المتساوية والمتعاكسة في قانون نيوتن الثالث؟',a:['الوزن والكتلة','الفعل ورد الفعل','القوى المتزنة فقط'],c:1,why:'يسمى أحد التأثيرين الفعل والآخر رد الفعل، ويؤثر كل منهما في جسم مختلف.'}]}
];
let current={role:'student',name:'المستكشف',username:'guest'},activeGame=null;
let sessionResults=[];
const $=s=>document.querySelector(s),app=$('#app');
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2600)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function studentResults(){return sessionResults}
function renderStudent(){const results=studentResults(),best=results.reduce((n,r)=>n+r.score,0),done=results.length,stars=results.reduce((n,r)=>n+r.stars,0);app.innerHTML=`<div class="header-row"><div class="greeting"><h1>أهلًا بك أيها المستكشف! 👋</h1><p>مستعد تكتشف كيف تغيّر القوى حركة الأجسام؟</p></div><span class="badge">مستكشف قوى صغير</span></div><section class="hero"><div><span class="lesson-chip">⭐ مغامرتك العلمية بانتظارك</span><h2>القوى تُحرّك العالم!</h2><p>أجب عن الأسئلة، اجمع النجوم، وتعرّف إلى قوانين نيوتن بطريقة ممتعة.</p><button class="primary" onclick="startGame(0)">ابدأ المغامرة ←</button></div><img class="hero-mark" src="https://ipa.edu.jo/wp-content/uploads/2026/04/logo-1.png" alt="شعار أكاديمية الرواد"></section><div class="stats"><div class="stat"><div class="stat-ico">⭐</div><div><strong>${stars}</strong><small>نجومك</small></div></div><div class="stat"><div class="stat-ico">🎯</div><div><strong>${done}</strong><small>مغامرات هذه الجلسة</small></div></div><div class="stat"><div class="stat-ico">🏆</div><div><strong>${done?Math.round(best/(done*4)*100):0}%</strong><small>متوسط الإجابات الصحيحة</small></div></div></div><section class="lab-card"><div class="lab-heading"><div><h2>🧲 مختبر سحب المكعبات</h2><p>اسحب مكعبات القوة إلى جانبي الصندوق واكتشف المحصلة!</p></div><span class="badge">تجربة تفاعلية</span></div><div class="lab-board"><div class="lab-zones"><div class="lab-zone" data-side="left"><h3>➡️ قوى إلى اليمين</h3><div class="force-pile" id="leftPile"></div></div><div class="lab-zone" data-side="right"><h3>⬅️ قوى إلى اليسار</h3><div class="force-pile" id="rightPile"></div></div></div><div class="lab-floor"><div class="lab-object" id="labObject">📦</div></div></div><div class="force-bank"><small>كل مكعب يمثّل قوة مقدارها 10 نيوتن. اسحب المكعب إلى أحد الجانبين:</small>${[1,2,3,4,5,6].map(i=>`<button class="force-cube" data-cube="${i}" data-source="bank" onpointerdown="beginCubeDrag(event,this)">10 N</button>`).join('')}</div><div class="lab-readout"><div class="lab-result" id="labResult" aria-live="polite">لم تتم إضافة قوى بعد — اسحب مكعبًا للتجربة.</div><button class="secondary" onclick="resetForceLab()">إعادة ضبط ↻</button></div><p class="lab-help">جرّب قوى متساوية ومتعاكسة لتشاهد الاتزان (محصلة صفر)، أو أضف مكعبات أكثر إلى أحد الجانبين لترى اتجاه الحركة. يمكنك سحب المكعب بين الجانبين أو لمسه لإزالته.</p></section><section class="tug-card"><div class="lab-heading"><div><h2>🪢 لعبة شدّ الحبل</h2><p>وازن القوتين، ثم شدّ الحبل وشاهد أي فريق يحرّك العلامة الوسطى!</p></div><span class="badge">تحدّي القوى</span></div><div class="tug-arena"><div class="tug-track"><span class="tug-team-figure left">🧑‍🚀</span><span class="tug-team-figure right">🧑‍🚀</span><span class="tug-goal left"></span><span class="tug-goal right"></span><div class="tug-rope" id="tugRope"></div><div class="tug-knot" id="tugKnot"></div></div><div class="tug-meter"><span>منطقة الفريق البنفسجي</span><span>الوسط — محصلة صفر</span><span>منطقة الفريق الذهبي</span></div></div><div class="tug-controls"><div class="tug-team"><h3 style="color:var(--purple)">🟣 الفريق البنفسجي</h3><small>اختر قوة السحب</small><div class="tug-force"><span id="purpleForceLabel">20</span> N</div><input type="range" id="purpleForce" min="10" max="50" step="10" value="20" oninput="updateTugLabels()" aria-label="قوة الفريق البنفسجي"></div><div class="tug-center"><button class="tug-action" id="tugPull" onclick="pullRope()">اسحب الحبل! 💪</button></div><div class="tug-team"><h3 style="color:#af7910">🟡 الفريق الذهبي</h3><small>اختر قوة السحب</small><div class="tug-force"><span id="goldForceLabel">20</span> N</div><input type="range" id="goldForce" min="10" max="50" step="10" value="20" oninput="updateTugLabels()" aria-label="قوة الفريق الذهبي"></div></div><div class="tug-readout"><div class="tug-status" id="tugStatus" aria-live="polite">الفريقان متعادلان: قوتان متساويتان، والمحصلة صفر نيوتن.</div><div class="tug-score" id="tugScore">الجولات: ٠ · تعادلات: ٠</div><button class="secondary" onclick="resetTug()">جولة جديدة ↻</button></div><p class="lab-help">عدّل القوتين قبل كل جولة. كل فريق يسحب الحبل باتجاهه، والمحصلة تساوي الفرق بين القوتين. جرّب قوتين متساويتين لترى الاتزان!</p></section><div class="section-head"><h2>اختر مغامرتك</h2><span>كل مغامرة فيها ٤ أسئلة قصيرة</span></div><div class="levels">${lesson.map((l,i)=>`<article class="level"><div class="level-icon">${l.icon}</div><h3>${l.title}</h3><p>${l.desc}</p><div class="level-foot"><small>${results.filter(r=>r.level===i).length?'✅ لعبتها '+results.filter(r=>r.level===i).length+' مرة':'⏱ ٣ دقائق تقريبًا'}</small><button class="primary" onclick="startGame(${i})">العب الآن</button></div></article>`).join('')}</div><div class="footer-credit">إعداد المعلم أحمد المحروق · قسم العلوم · ثانوية البنين</div>`;forceLab={left:[],right:[]};forceCubeId=7;tugPosition=0;tugRounds=0;tugDraws=0;renderLab();updateTugLabels();updateTugScore()}
let forceLab={left:[],right:[]},forceCubeId=7,dragState=null,dragGhost=null;
function renderLab(){if(!$('#leftPile')||!$('#rightPile'))return;for(const side of ['left','right'])$('#'+side+'Pile').innerHTML=forceLab[side].map(id=>`<button class="force-cube placed" data-cube="${id}" data-source="${side}" title="اسحب لنقل المكعب أو المسه لإزالته" onpointerdown="beginCubeDrag(event,this)">10 N</button>`).join('');const left=forceLab.left.length*10,right=forceLab.right.length*10,net=left-right,result=$('#labResult'),box=$('#labObject');if(!result)return;if(left===0&&right===0){result.textContent='لم تتم إضافة قوى بعد — اسحب مكعبًا للتجربة.';box.style.transform='translateX(0)';return}if(net===0){result.textContent=`متزنة! ${left} N يمينًا و${right} N يسارًا → المحصلة 0 N.`;box.style.transform='translateX(0)'}else{const direction=net>0?'اليمين':'اليسار';result.textContent=`المحصلة ${Math.abs(net)} N نحو ${direction} (${left} N يمينًا مقابل ${right} N يسارًا).`;box.style.transform=`translateX(${net>0?30:-30}px)`}}
function beginCubeDrag(event,el){if(event.button!==undefined&&event.button!==0)return;event.preventDefault();const source=el.dataset.source,id=Number(el.dataset.cube);dragState={id,source,moved:false};dragGhost=el.cloneNode(true);dragGhost.classList.add('drag-ghost');dragGhost.style.left=event.clientX+'px';dragGhost.style.top=event.clientY+'px';document.body.appendChild(dragGhost);window.addEventListener('pointermove',moveCubeDrag);window.addEventListener('pointerup',endCubeDrag,{once:true})}
function moveCubeDrag(event){if(!dragState||!dragGhost)return;dragState.moved=true;dragGhost.style.left=event.clientX+'px';dragGhost.style.top=event.clientY+'px';document.querySelectorAll('.lab-zone').forEach(zone=>zone.classList.toggle('drag-over',document.elementFromPoint(event.clientX,event.clientY)&&document.elementFromPoint(event.clientX,event.clientY).closest('.lab-zone')===zone))}
function endCubeDrag(event){window.removeEventListener('pointermove',moveCubeDrag);document.querySelectorAll('.lab-zone').forEach(zone=>zone.classList.remove('drag-over'));if(dragGhost){dragGhost.remove();dragGhost=null}if(!dragState)return;const drag=dragState;dragState=null;if(drag.source!=='bank'&&!drag.moved){forceLab[drag.source]=forceLab[drag.source].filter(id=>id!==drag.id);renderLab();return}const point=document.elementFromPoint(event.clientX,event.clientY);const target=point?point.closest('.lab-zone'):null;if(target){if(drag.source!=='bank')forceLab[drag.source]=forceLab[drag.source].filter(id=>id!==drag.id);forceLab[target.dataset.side].push(drag.source==='bank'?forceCubeId++:drag.id);renderLab()}}
function resetForceLab(){forceLab={left:[],right:[]};forceCubeId=7;renderLab()}
let tugRounds=0,tugDraws=0,tugPosition=0;
function updateTugLabels(){const purple=Number($('#purpleForce')?$('#purpleForce').value:20),gold=Number($('#goldForce')?$('#goldForce').value:20);if($('#purpleForceLabel'))$('#purpleForceLabel').textContent=purple;if($('#goldForceLabel'))$('#goldForceLabel').textContent=gold}
function updateTugScore(){if($('#tugScore'))$('#tugScore').textContent=`الجولات: ${new Intl.NumberFormat('ar').format(tugRounds)} · تعادلات: ${new Intl.NumberFormat('ar').format(tugDraws)}`}
function pullRope(){const purple=Number($('#purpleForce')?$('#purpleForce').value:20),gold=Number($('#goldForce')?$('#goldForce').value:20),status=$('#tugStatus'),knot=$('#tugKnot'),rope=$('#tugRope');if(!status||!knot)return;tugRounds++;const net=purple-gold;if(net===0){tugDraws++;tugPosition=0;knot.style.left='50%';rope.style.transform='translateX(0)';status.textContent=`تعادل! ${purple} N مقابل ${gold} N؛ المحصلة صفر، والقوى متزنة.`;status.style.color='var(--deep)'}else{const towardPurple=net>0,step=Math.sign(net)*Math.max(7,Math.min(19,Math.abs(net)*.45));tugPosition=Math.max(-30,Math.min(30,tugPosition+step));knot.style.left=`calc(50% + ${tugPosition}%)`;rope.style.transform=`translateX(${net>0?-10:10}px)`;status.textContent=`الفريق ${towardPurple?'البنفسجي':'الذهبي'} يفوز! المحصلة ${Math.abs(net)} N باتجاهه؛ لأن قوته أكبر.`;status.style.color=towardPurple?'var(--purple)':'#986600'}updateTugScore()}
function resetTug(){tugPosition=0;if($('#purpleForce'))$('#purpleForce').value=20;if($('#goldForce'))$('#goldForce').value=20;if($('#tugKnot'))$('#tugKnot').style.left='50%';if($('#tugRope'))$('#tugRope').style.transform='translateX(0)';if($('#tugStatus')){$('#tugStatus').textContent='جولة جديدة! اختر قوة كل فريق ثم اسحب الحبل.';$('#tugStatus').style.color='var(--deep)'}updateTugLabels()}
function startGame(i){activeGame={level:i,index:0,score:0,selected:null,locked:false};renderGame()}
function renderGame(){const g=activeGame,l=lesson[g.level],q=l.questions[g.index];app.innerHTML=`<div class="game-wrap"><div class="game-top"><button class="secondary" onclick="renderStudent()">← رجوع للمغامرات</button><span class="question-count">السؤال ${g.index+1} من ${l.questions.length}</span></div><div class="panel"><div class="progress"><span style="width:${(g.index/l.questions.length)*100}%"></span></div><span class="badge">${l.icon} ${l.title}</span><h2 class="question">${q.q}</h2><div class="answers">${q.a.map((a,i)=>`<button class="answer ${g.locked?(i===q.c?'correct':i===g.selected?'wrong':''):''}" ${g.locked?'disabled':''} onclick="chooseAnswer(${i})">${['أ','ب','ج'][i]}. ${a}</button>`).join('')}</div>${g.locked?`<div class="feedback ${g.selected===q.c?'good':'bad'}">${g.selected===q.c?'رائع! إجابة صحيحة 🌟':'قريب! الإجابة الصحيحة: '+q.a[q.c]}<br>${q.why}</div>`:''}<div class="game-next"><span class="stars">${'★'.repeat(Math.max(0,g.score))}${'☆'.repeat(l.questions.length-g.score)}</span>${g.locked?`<button class="primary" onclick="nextQuestion()">${g.index===l.questions.length-1?'عرض النتيجة':'السؤال التالي ←'}</button>`:`<span class="question-count">اختر إجابة للمتابعة</span>`}</div></div></div>`}
function chooseAnswer(i){const g=activeGame;if(!g||g.locked)return;g.selected=i;g.locked=true;if(i===lesson[g.level].questions[g.index].c)g.score++;renderGame()}
function nextQuestion(){if(activeGame.index<lesson[activeGame.level].questions.length-1){activeGame.index++;activeGame.locked=false;activeGame.selected=null;renderGame()}else finishGame()}
function finishGame(){
 const g=activeGame,l=lesson[g.level],stars=g.score===4?3:g.score>=3?2:g.score>=2?1:0;
 sessionResults.push({username:'guest',name:'المستكشف',level:g.level,title:l.title,score:g.score,total:l.questions.length,stars,date:new Date().toISOString()});
 activeGame=null;
 app.innerHTML=`<div class="game-wrap panel result"><div class="medal">${stars===3?'🏆':stars?'🥇':'💪'}</div><span class="badge">اكتملت المغامرة</span><h2>أحسنت أيها المستكشف!</h2><p>${stars===3?'أداء رائع! أنت بطل القوى.':stars?'عمل جميل! راجع إجاباتك وحاول تحصد نجومًا أكثر.':'التعلم مغامرة، جرّب مرة أخرى وستتحسن!'}</p><div class="result-score">${g.score} / ${l.questions.length} إجابات صحيحة</div><div class="stars" style="font-size:28px">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p>${l.title} · ${stars} من ٣ نجوم</p><button class="primary" onclick="renderStudent()">العودة إلى المغامرات</button> <button class="secondary" onclick="startGame(${g.level})">إعادة اللعب ↻</button></div>`;
}
try{renderStudent()}catch(e){console.error(e);app.textContent='تعذر تشغيل النشاط: '+e.message}
</script>
</body>
</html>
